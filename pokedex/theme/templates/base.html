{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <title>{% block title %}Pokédex{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% tailwind_css %}

    <!-- Police "pixel" façon Game Boy, utilisée pour les titres -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        .titre { font-family: 'Press Start 2P', monospace; line-height: 1.6; }

        /* Une couleur par type de Pokémon */
        .type { display: inline-block; padding: 2px 10px; border-radius: 9999px;
                color: white; font-size: 0.8rem; text-transform: capitalize; }
        .type-normal   { background: #A8A878; }
        .type-fire     { background: #F08030; }
        .type-water    { background: #6890F0; }
        .type-grass    { background: #78C850; }
        .type-electric { background: #F8D030; color: #333; }
        .type-ice      { background: #98D8D8; color: #333; }
        .type-fighting { background: #C03028; }
        .type-poison   { background: #A040A0; }
        .type-ground   { background: #E0C068; color: #333; }
        .type-flying   { background: #A890F0; }
        .type-psychic  { background: #F85888; }
        .type-bug      { background: #A8B820; }
        .type-rock     { background: #B8A038; }
        .type-ghost    { background: #705898; }
        .type-dragon   { background: #7038F8; }
        .type-dark     { background: #705848; }
        .type-steel    { background: #B8B8D0; color: #333; }
        .type-fairy    { background: #EE99AC; color: #333; }
    </style>
</head>

<body class="bg-sky-50 text-gray-900 font-sans leading-normal min-h-screen">
    <!-- Menu commun à toutes les pages, aux couleurs du logo Pokémon -->
    <nav class="bg-blue-900 text-white border-b-4 border-yellow-400">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center gap-8">
            <a href="{% url 'home' %}" class="titre text-yellow-400 text-lg">Pokédex</a>
            <a href="{% url 'home' %}" class="hover:text-yellow-400">Pokémon</a>
            <a href="{% url 'equipes' %}" class="hover:text-yellow-400">Équipes</a>
            <a href="{% url 'combat' %}" class="hover:text-yellow-400">Combat</a>
        </div>
    </nav>

    {% block content %}{% endblock %}
</body>
</html>
